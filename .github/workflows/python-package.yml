name: Python calculator CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lint tool
        run: python -m pip install flake8
      - name: Check syntax and undefined names
        run: |
          python -m compileall -q scripts
          python -m flake8 scripts --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Verify documented example and input validation
        run: |
          python - <<'PY'
          import json
          import math
          import subprocess
          import sys

          command = [sys.executable, "scripts/calcular.py", "--flow-m3h", "12000",
                     "--pressure", "180", "--unit", "mmca", "--pressure-basis", "total",
                     "--efficiency-basis", "total", "--efficiency", "0.72",
                     "--duct-velocity", "10"]
          result = subprocess.run(command, check=True, capture_output=True, text=True)
          data = json.loads(result.stdout)
          expected = {"flow_m3s": 3.3333333333333335, "pressure_Pa": 1765.197,
                      "air_power_kW": 5.88399, "shaft_power_kW": 8.172208333333333,
                      "duct_area_m2": 1 / 3}
          for key, value in expected.items():
              assert math.isclose(data[key], value, rel_tol=1e-9), (key, data[key], value)
          for flag, value in [("--flow-m3h", "0"), ("--pressure", "-1"),
                              ("--efficiency", "1.1"), ("--flow-m3h", "nan"),
                              ("--efficiency-basis", "static")]:
              invalid = command.copy()
              invalid[invalid.index(flag) + 1] = value
              rejected = subprocess.run(invalid, capture_output=True, text=True)
              assert rejected.returncode == 2, (flag, value, rejected.returncode)
          print("Documented example and 5 invalid-input checks passed.")
          PY
